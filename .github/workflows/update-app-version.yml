name: Update app version from merged PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set version to merged PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '// Updated automatically whenever a pull request is merged into main.\nexport const APP_VERSION = %s;\n' "$PR_NUMBER" > saturday-game-night/src/version.js
      - name: Commit version update
        run: |
          if git diff --quiet; then
            echo "Version is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saturday-game-night/src/version.js
          git commit -m "chore: set app version to PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main
